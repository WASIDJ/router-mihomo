# No remote proxy exists yet. DIRECT is an explicit bootstrap state.
mixed-port: 7890
tproxy-port: 7893
allow-lan: true
bind-address: '*'
lan-allowed-ips:
  - 127.0.0.0/8
  - 192.168.50.0/24
mode: rule
log-level: warning
ipv6: false
find-process-mode: off
external-controller: 192.168.50.1:9090
secret: __API_SECRET__
external-ui: /tmp/mihomo/ui
authentication:
  - 'router:__PROXY_SECRET__'
skip-auth-prefixes:
  - 127.0.0.1/32
interface-name: eth0
profile:
  store-selected: false
  store-fake-ip: false
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  use-system-hosts: true
  nameserver:
    - 192.168.1.1
  proxy-server-nameserver:
    - 192.168.1.1
proxies: []
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT
rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - MATCH,PROXY
